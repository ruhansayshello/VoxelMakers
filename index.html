    <meta property="og:title" content="VoxelMakers: Micro-Voxel Rig & Physics Sandbox" />

  <body class="bg-[#1a1a1a] text-[#e5e5e5] overflow-hidden select-none" data-state="title">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('caches' in window) {
        caches.delete('voxelmakers-v1').catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then(reg => {
              reg.update().catch(() => {});
              console.log('[PWA] ServiceWorker registered:', reg.scope);
            })
            .catch(err => console.log('[PWA] ServiceWorker failed:', err));
        });
      }
    </script>
  </body>
